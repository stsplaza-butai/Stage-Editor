<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>舞台図面エディター Ver1.0</title>
    <script src="fabric.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    
    <style>
        /* --- レイアウト定義 --- */
        body { 
            font-family: "Helvetica Neue", Arial, sans-serif; 
            background-color: #cfd8dc; 
            margin: 0; padding: 0; height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* ヘッダー (高さ30px) */
        header {
            background: #263238; color: white; padding: 0 15px; 
            display: flex; align-items: center; gap: 15px;
            flex-wrap: wrap; flex-shrink: 0;
            border-bottom: 1px solid #102027; height: 30px;
        }
        header .title { font-weight: bold; font-size: 14px; margin-right: auto; color: #eceff1;}
        .input-group { display: flex; align-items: center; gap: 5px; font-size: 11px; }
        header input { padding: 2px 6px; border-radius: 3px; border: none; font-size: 11px; background: #cfd8dc; color: #333;}
        
        .btn-stamp {
            cursor: pointer; border: 1px solid #b0bec5; background: #eceff1; border-radius: 3px; 
            padding: 2px 8px; font-size: 11px; font-weight: bold; color: #333; transition: 0.1s;
        }
        .btn-stamp:hover { background: #fff; }

        #eventName { width: 180px; } 
        #eventPlace { width: 160px; } 

        /* ツールバー (高さ30px) */
        .top-toolbar {
            background: #eceff1; border-bottom: 1px solid #b0bec5; padding: 0 10px;
            display: flex; align-items: center; gap: 10px; 
            flex-wrap: wrap; flex-shrink: 0; height: 30px;
        }
        .toolbar-group { display: flex; align-items: center; gap: 5px; padding-right: 12px; border-right: 1px solid #ccc; }
        .toolbar-group:last-child { border-right: none; }
        .group-label { font-size: 10px; color: #546e7a; font-weight: bold; margin-right: 5px; white-space: nowrap;}
        
        .top-toolbar button { 
            cursor: pointer; border: 1px solid #b0bec5; background: white; border-radius: 3px; 
            padding: 0 6px; font-size: 11px; 
            transition: 0.1s; display: flex; align-items: center; gap: 2px; height: 24px;
        }
        .top-toolbar button:hover { background: #e3f2fd; border-color: #2196f3; }
        .btn-blue { color: #0277bd; font-weight: bold; background-color: #e1f5fe; border-color: #81d4fa;}
        .btn-green { color: #2e7d32; font-weight: bold; background-color: #e8f5e9; border-color: #a5d6a7;}
        .btn-red { color: #c62828; font-weight: bold; background-color: #ffebee; border-color: #ef9a9a;}

        /* サイドバー */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar {
            width: 130px; background: #fff; border-right: 1px solid #ccc;
            padding: 8px; overflow-y: auto; display: flex; flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); flex-shrink: 0;
        }
        .section-header { font-size: 10px; font-weight: bold; color: #455a64; margin: 12px 0 4px 0; border-bottom: 1px solid #cfd8dc; padding-bottom: 2px;}

        /* クイックカラー */
        .quick-colors { display: grid; grid-template-columns: repeat(6, 18px); gap: 2px; margin-bottom: 5px; }
        .color-chip {
            width: 18px; height: 18px; border: 1px solid #e0e0e0; border-radius: 2px; cursor: pointer;
            font-size: 8px; display: flex; align-items: center; justify-content: center;
        }
        .color-chip:hover { transform: scale(1.3); border-color: #666; z-index: 100; box-shadow: 0 0 4px rgba(0,0,0,0.3);}
        
        .style-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; margin-bottom: 3px;}
        input[type="number"] { width: 35px; padding: 2px; font-size: 10px; }
        input[type="range"] { width: 60px; height: 10px; cursor: pointer; }

        /* ボタン・グリッド */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .item-btn {
            padding: 2px; border: 1px solid #cfd8dc; background: #f8f9fa; border-radius: 4px;
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
            font-size: 10px; color: #37474f; height: 28px; cursor: pointer; text-align: center;
            box-sizing: border-box; 
            transition: all 0.2s;
        }
        .item-btn:hover { background: #fff3e0; border-color: #ff9800; }
        
        .item-btn.active {
            background-color: #ffca28 !important;
            color: #000;
            border-color: #ff6f00;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .item-btn span { font-size: 14px; margin-bottom: 0; }
        .btn-full { width: 100%; }

        /* キャンバス */
        .canvas-area {
            flex: 1; display: flex; justify-content: center; align-items: flex-start;
            background-color: #b0bec5; overflow: auto; padding: 20px;
        }
        .canvas-wrapper { box-shadow: 0 0 20px rgba(0,0,0,0.5); border: 1px solid #000; background: white; }

        /* ステータスバー */
        .status-bar {
            background: #263238; color: #eceff1; font-size: 11px; font-family: monospace;
            padding: 0 10px; display: flex; align-items: center; gap: 15px;
            height: 24px; border-top: 1px solid #102027; flex-shrink: 0;
        }
        .status-item { display: flex; align-items: center; gap: 5px; }
        .status-label { color: #b0bec5; }
        
        .spacer { flex: 1; }

        /* ズームコントローラー */
        .zoom-ctrl { display: flex; align-items: center; border-left: 1px solid #455a64; padding-left: 10px; }
        .zoom-btn { background: #37474f; border: 1px solid #455a64; color: white; cursor: pointer; padding: 1px 6px; font-size: 10px; border-radius: 3px; }
        .zoom-btn:hover { background: #546e7a; }
        .zoom-val { color: #fff; font-size: 11px; padding: 0 5px; min-width: 35px; text-align: center; }

    </style>
</head>
<body>

    <header>
        <div class="title">舞台図面エディター Ver1.0</div>
        <div class="input-group"><label>📅</label><input type="date" id="eventDate"></div>
        <div class="input-group"><label>🏷️</label><input type="text" id="eventName" placeholder="イベント名"></div>
        <div class="input-group"><label>📍</label><input type="text" id="eventPlace" placeholder="場所"></div>
        <button class="btn-stamp" onclick="addStamp()">📝 打刻</button>
    </header>

    <div class="top-toolbar">
        <div class="toolbar-group">
            <span class="group-label">ファイル</span>
            <button onclick="saveJSON()" class="btn-blue">保存</button>
            <button onclick="document.getElementById('jsonInput').click()">開く</button>
            <input type="file" id="jsonInput" accept=".json" onchange="loadJSON(this)" style="display:none">
            <button onclick="saveJPG()" class="btn-green">JPG</button>
            <button onclick="savePDF()" class="btn-red">PDF</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">編集</span>
            <button onclick="copyObject()" title="Ctrl+C">コピー</button>
            <button onclick="pasteObject()" title="Ctrl+V">ペースト</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">履歴</span>
            <button onclick="undo()">↩️</button>
            <button onclick="redo()">↪️</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">順序</span>
            <button onclick="bringToFront()" title="最前面">⬆️最前</button>
            <button onclick="bringForward()" title="前面">↑前</button>
            <button onclick="sendBackwards()" title="背面">↓奥</button>
            <button onclick="sendToBack()" title="最背面">⬇️最奥</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">グループ</span>
            <button onclick="groupObjects()">🔗</button>
            <button onclick="ungroupObjects()">🔓</button>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="section-header" style="margin-top:0;">🏟️ 背景操作</div>
            
            <div class="grid-2">

                <button id="btn-daikoku" onclick="toggleLayer('daikoku', this, addDaikokuMaku)" class="item-btn" style="background:#ce93d8;">大黒幕</button>
                <button id="btn-reflect" onclick="toggleLayer('reflect', this, addReflectingBoard)" class="item-btn" style="background:#fff9c4;">反響板</button>
                <button id="btn-doncho" onclick="toggleLayer('doncho', this, addDoncho)" class="item-btn" style="background:#c8e6c9;">緞帳</button>

                <div class="color-chip" style="background:#ffffff;" onclick="applyStyle('fill', '#ffffff')" title="白"></div>

                <div class="color-chip" style="background:#000000;" onclick="applyStyle('fill', '#000000')" title="黒"></div>
                <div class="color-chip" style="background:#e53935;" onclick="applyStyle('fill', '#e53935')" title="赤"></div>

                <div class="color-chip" style="background:#43a047;" onclick="applyStyle('fill', '#43a047')" title="緑"></div>
                <div class="color-chip" style="background:#fdd835;" onclick="applyStyle('fill', '#fdd835')" title="黄"></div>

                <div class="color-chip" style="background:#8e24aa;" onclick="applyStyle('fill', '#8e24aa')" title="紫"></div>
                <div class="color-chip" style="background:#ffcdd2;" onclick="applyStyle('fill', '#ffcdd2')" title="薄赤"></div>
                <div class="color-chip" style="background:#bbdefb;" onclick="applyStyle('fill', '#bbdefb')" title="水色"></div>
                <div class="color-chip" style="background:#c8e6c9;" onclick="applyStyle('fill', '#c8e6c9')" title="薄緑"></div>

        <div class="canvas-area">

    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">🖱️</span>
            <span id="mouseCoords">X: 0 Y: 0</span>
        </div>
        <div class="status-item">
            <span class="status-label">📏</span>
            <span id="objSize">W: - H: -</span>
        </div>
        <div class="status-item">
            <span class="status-label">📐</span>
            <span id="objAngle">A: 0°</span>
        </div>
        
        <div class="spacer"></div> 

        <div class="zoom-ctrl">
            <button class="zoom-btn" onclick="changeZoom(-0.1)">🔍-</button>
            <span class="zoom-val" id="zoomVal">100%</span>
            <button class="zoom-btn" onclick="changeZoom(0.1)">🔍+</button>
        </div>
    </div>

    <script>
        const canvas = new fabric.Canvas('c', { preserveObjectStacking: true });
        canvas.backgroundColor = "white";

        let persistentSelection = null;
        let _clipboard = null;
        const DEFAULT_FONT = 'Arial'; 

        // 履歴管理
        let history = []; 
        let historyStep = -1; 
        let isHistoryLocked = false;
        let isBatchDrawing = false; 
        const PROPERTIES_TO_INCLUDE = ['id', 'isBackground', 'selectable', 'evented', 'strokeDashArray', 'lockScalingX', 'lockScalingY', 'layerId', 'strokeUniform'];

        function saveHistory() {
            if (isHistoryLocked || isBatchDrawing) return;
            if (historyStep < history.length - 1) {
                history = history.slice(0, historyStep + 1);
            }
            history.push(JSON.stringify(canvas.toJSON(PROPERTIES_TO_INCLUDE)));
            historyStep++;
            if (history.length > 30) { history.shift(); historyStep--; }
            
            updateLayerButtonStates(); 
        }

        canvas.on('object:added', (e) => { 
            if(!e.target.excludeFromExport && !isBatchDrawing) saveHistory(); 
        });
        canvas.on('object:modified', saveHistory);
        canvas.on('object:removed', (e) => {
            if(!isBatchDrawing) saveHistory();
        });

        // ズーム機能
        let currentZoom = 1;
        let baseHeight = 500;
        let baseWidth = 840;

        function updateCanvasDimensions() {
            canvas.setDimensions({
                width: baseWidth * currentZoom,
                height: baseHeight * currentZoom
            });
            canvas.setZoom(currentZoom);
        }

        function changeZoom(delta) {
            let newZoom = currentZoom + delta;
            if (newZoom < 0.5) newZoom = 0.5;
            if (newZoom > 2.0) newZoom = 2.0;
            newZoom = Math.round(newZoom * 10) / 10;
            
            if (newZoom !== currentZoom) {
                currentZoom = newZoom;
                document.getElementById('zoomVal').textContent = Math.round(currentZoom * 100) + '%';
                updateCanvasDimensions();
            }
        }

        // ステータスバー処理
        canvas.on('mouse:move', function(opt) {
            const p = canvas.getPointer(opt.e);
            document.getElementById('mouseCoords').textContent = `X: ${Math.round(p.x)} Y: ${Math.round(p.y)}`;
        });

        function updateObjStatus() {
            const active = canvas.getActiveObject();
            const elSize = document.getElementById('objSize');
            const elAngle = document.getElementById('objAngle');
            
            if (active) {
                if (active.width) {
                    const w = Math.round(active.getScaledWidth());
                    const h = Math.round(active.getScaledHeight());
                    elSize.textContent = `W: ${w} H: ${h}`;
                } else {
                    elSize.textContent = 'W: - H: -';
                }
                const ang = Math.round(active.angle % 360);
                elAngle.textContent = `A: ${ang}°`;
            } else {
                elSize.textContent = 'W: - H: -';
                elAngle.textContent = 'A: 0°';
            }
        }
        canvas.on('selection:created', updateObjStatus);
        canvas.on('selection:updated', updateObjStatus);
        canvas.on('selection:cleared', updateObjStatus);
        canvas.on('object:modified', updateObjStatus);
        canvas.on('object:rotating', updateObjStatus);

        // --- Shiftキーによる移動制限 ---
        canvas.on('mouse:down', function(opt) {
            const target = opt.target;
            if (target) {
                // 移動開始時の座標を記録
                target._startLeft = target.left;
                target._startTop = target.top;
            }
        });

        canvas.on('object:moving', function(opt) {
            const target = opt.target;
            // Shiftキーが押されている場合のみ処理
            if (target && opt.e.shiftKey) {
                const dx = Math.abs(target.left - target._startLeft);
                const dy = Math.abs(target.top - target._startTop);
                
                if (dx > dy) {
                    // 水平移動優先: Yを固定
                    target.set('top', target._startTop);
                } else {
                    // 垂直移動優先: Xを固定
                    target.set('left', target._startLeft);
                }
            }
        });

        function restoreBackgroundState() {
            const objects = canvas.getObjects();
            objects.forEach(obj => {
                if (obj.isBackground) {
                    obj.set({ selectable: false, evented: false });
                    canvas.sendToBack(obj);
                }
            });
            updateLayerButtonStates(); 
            canvas.requestRenderAll();
        }

        function undo() {
            if (historyStep > 0) {
                isHistoryLocked = true;
                historyStep--;
                canvas.loadFromJSON(history[historyStep], function() { 
                    restoreBackgroundState(); 
                    isHistoryLocked = false; 
                    persistentSelection = null; 
                    updateObjStatus();
                });
            }
        }
        
        function redo() {
            if (historyStep < history.length - 1) {
                isHistoryLocked = true;
                historyStep++;
                canvas.loadFromJSON(history[historyStep], function() { 
                    restoreBackgroundState(); 
                    isHistoryLocked = false; 
                    persistentSelection = null; 
                    updateObjStatus();
                });
            }
        }

        window.onload = function() {
            drawDefaultStage();
        };

        function toggleLayer(layerId, btnElement, drawFunc) {
            isBatchDrawing = true; 
            const objects = canvas.getObjects().filter(o => o.layerId === layerId);

            if (objects.length > 0) {
                const isVisible = !objects[0].visible;
                objects.forEach(o => o.set('visible', isVisible));
                
                if (isVisible) {
                     btnElement.classList.add('active');
                     objects.forEach(o => canvas.sendToBack(o));
                } else {
                     btnElement.classList.remove('active');
                }
            } else {
                drawFunc(); 
                btnElement.classList.add('active');
            }
            
            isBatchDrawing = false;
            canvas.requestRenderAll();
            saveHistory(); 
        }

        function toggleAudienceArea(btn) {
            if (baseHeight === 500) {
                baseHeight = 1650;
                btn.classList.add('active');
            } else {
                baseHeight = 500;
                btn.classList.remove('active');
            }
            updateCanvasDimensions();
            canvas.renderAll();
            saveHistory();
        }
        
        function updateLayerButtonStates() {
            const layers = [
                {id: 'sideCurtains', btn: 'btn-sideCurtains'},
                {id: 'daikoku', btn: 'btn-daikoku'},
                {id: 'reflect', btn: 'btn-reflect'},
                {id: 'doncho', btn: 'btn-doncho'},
                {id: 'retractable', btn: 'btn-retractable'}
            ];
            
            layers.forEach(l => {
                const objs = canvas.getObjects().filter(o => o.layerId === l.id);
                const btn = document.getElementById(l.btn);
                if(btn) {
                    if (objs.length > 0 && objs[0].visible) {
                        btn.classList.add('active');

        function createWaveLine(x, y, len, color, layerId) {
            const offsetX = 20;
            let startX = x + offsetX;
            let d = `M ${startX} ${y}`; 
            const waveStep = 10; const amp = 5;       
            for (let i = 0; i < len; i += waveStep) {
                const nextX = startX + i + waveStep; const targetX = (nextX > startX + len) ? startX + len : nextX;
                const cpX = startX + i + (waveStep / 2); const cpY = ( (i / waveStep) % 2 === 0 ) ? y - amp : y + amp;
                d += ` Q ${cpX} ${cpY} ${targetX} ${y}`;
            }
            return new fabric.Path(d, { stroke: color, strokeWidth: 1, fill: 'transparent', selectable: false, evented: false, isBackground: true, layerId: layerId });
        }

        function addSideCurtains() {
            const layerId = 'sideCurtains';
            const curtains = [{ y: 340, len: 62 }, { y: 260, len: 85 }, { y: 180, len: 107 }, { y: 110, len: 130 }, { y: 40,  len: 62 }];
            const color = '#999';
            curtains.forEach(c => {
                canvas.add(createWaveLine(0, c.y, c.len, color, layerId));
                let startRight = 820 - c.len; 
                let dRight = `M ${startRight} ${c.y}`;
                const waveStep = 10; const amp = 5;
                for(let i=0; i<c.len; i+=waveStep) {
                     const nextX = startRight + i + waveStep;
                     const targetX = (nextX > startRight + c.len) ? startRight + c.len : nextX;
                     const cpX = startRight + i + (waveStep/2);
                     const cpY = ((i/waveStep)%2===0) ? c.y-amp : c.y+amp;
                     dRight += ` Q ${cpX} ${cpY} ${targetX} ${c.y}`;
                }
                const p = new fabric.Path(dRight, { stroke: color, strokeWidth: 1, fill: 'transparent', selectable: false, evented: false, isBackground: true, layerId: layerId });
                canvas.add(p);
            });
            const backLine = new fabric.Line([60, 30, 780, 30], { stroke: '#333', strokeWidth: 2, selectable: false, evented: false, isBackground: true, layerId: layerId });
            canvas.add(backLine);
            const horiText = new fabric.Text("ホリゾント幕", { left: 420, top: 25, fontSize: 10, fill: '#ccc', fontFamily: DEFAULT_FONT, originX: 'center', originY: 'bottom', selectable: false, evented: false, isBackground: true, layerId: layerId });

            canvas.getObjects().filter(o=>o.layerId===layerId).forEach(o=>canvas.sendToBack(o));
        }

        function savePDF() {
            const { jsPDF } = window.jspdf; const pdf = new jsPDF(baseHeight > 600 ? 'p' : 'l', 'mm', 'a4');
            const imgData = canvas.toDataURL({ format: 'jpeg', quality: 1.0 });
            const pdfW = 210; const pdfH = (canvas.height * pdfW) / canvas.width;
            const pW = pdf.internal.pageSize.getWidth(); const pH = pdf.internal.pageSize.getHeight();
            const r = Math.min(pW/(canvas.width/currentZoom), pH/(canvas.height/currentZoom));
            pdf.addImage(imgData, 'JPEG', (pW - (canvas.width/currentZoom)*r)/2, 10, (canvas.width/currentZoom)*r, (canvas.height/currentZoom)*r);
            pdf.save(getFileName('pdf'));
        }
        function loadBackgroundFile(input) {
            const file = input.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const imgObj = new Image(); imgObj.src = e.target.result;
                imgObj.onload = () => {
                    clearBackground(); isBatchDrawing=true;
                    const imgInstance = new fabric.Image(imgObj);
                    const scale = Math.min(canvas.width / imgInstance.width, canvas.height / imgInstance.height);
                    imgInstance.set({ originX:'left', originY:'top', scaleX:scale, scaleY:scale, selectable:false, evented:false, isBackground:true });
                    canvas.setBackgroundImage(imgInstance, canvas.renderAll.bind(canvas)); 
                    isBatchDrawing=false; saveHistory();
                }
            };
            reader.readAsDataURL(file); input.value = '';
        }
        function clearBackground() {
            isBatchDrawing = true;
            const objects = canvas.getObjects();
            for (let i = objects.length - 1; i >= 0; i--) { if (objects[i].isBackground) canvas.remove(objects[i]); }
            canvas.setBackgroundImage(null, canvas.renderAll.bind(canvas));
            isBatchDrawing = false;
        }
        function copyObject() { const a = canvas.getActiveObject(); if(a) a.clone(c => _clipboard = c); }
        function pasteObject() {
            if(!_clipboard) return;
            _clipboard.clone(c => {
                canvas.discardActiveObject();
                c.set({ left: c.left+10, top: c.top+10, evented: true });
                if(c.type==='activeSelection') { c.canvas=canvas; c.forEachObject(o=>canvas.add(o)); c.setCoords(); } else canvas.add(c);
                _clipboard.top+=10; _clipboard.left+=10;
                canvas.setActiveObject(c); canvas.requestRenderAll(); saveHistory();
            });
        }
        function updateSelection() { const a = canvas.getActiveObject(); if(a){ persistentSelection=a; updateStylePanel(a); } }
        canvas.on('mouse:down', e => { if(!e.target) persistentSelection=null; });
        canvas.on('selection:created', updateSelection); canvas.on('selection:updated', updateSelection);

        function updateStylePanel(a) {
            if(a.strokeWidth!==undefined) document.getElementById('strokeWidth').value=a.strokeWidth;
            if(a.opacity!==undefined) { const v=Math.round(a.opacity*100); document.getElementById('opacityInput').value=v; }
        }
        function applyStyle(p,v) { const a = canvas.getActiveObject()||persistentSelection; if(a){ if(a.type==='activeSelection') a.getObjects().forEach(o=>o.set(p,v)); else a.set(p,v); canvas.requestRenderAll(); saveHistory(); } }
        function applyOpacity(v) { 
            const a = canvas.getActiveObject()||persistentSelection; if(a){ 
                const o=parseInt(v,10)/100; 
                if(a.type==='activeSelection') a.getObjects().forEach(obj=>obj.set('opacity',o)); else a.set('opacity',o); 
                canvas.requestRenderAll(); saveHistory(); 
            } 
        }

        function bringToFront(){ const a=canvas.getActiveObject(); if(a){ a.bringToFront(); saveHistory(); } }
        function bringForward(){ const a=canvas.getActiveObject(); if(a){ a.bringForward(); saveHistory(); } }
        function sendBackwards(){ const a=canvas.getActiveObject(); if(a){ a.sendBackwards(); saveHistory(); } }
        function sendToBack(){ const a=canvas.getActiveObject(); if(a){ a.sendToBack(); saveHistory(); } }
        function groupObjects(){ if(!canvas.getActiveObject() || canvas.getActiveObject().type!=='activeSelection')return; canvas.getActiveObject().toGroup(); canvas.requestRenderAll(); saveHistory(); persistentSelection=canvas.getActiveObject(); }
        function ungroupObjects(){ if(!canvas.getActiveObject() || canvas.getActiveObject().type!=='group')return; canvas.getActiveObject().toActiveSelection(); canvas.requestRenderAll(); saveHistory(); persistentSelection=canvas.getActiveObject(); }

        window.addEventListener('keydown', e => {
            if(document.activeElement.tagName==='INPUT')return;
            if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault(); undo(); return;}
            if((e.ctrlKey||e.metaKey)&&e.key==='y'){e.preventDefault(); redo(); return;}
            if((e.ctrlKey||e.metaKey)&&e.key==='c'){e.preventDefault(); copyObject(); return;}
            if((e.ctrlKey||e.metaKey)&&e.key==='v'){e.preventDefault(); pasteObject(); return;}
            if(e.key==='Delete'||e.key==='Backspace'){ 
                const a=canvas.getActiveObject(); 
                if(a && !a.isEditing){ canvas.discardActiveObject(); if(a.type==='activeSelection') a.getObjects().forEach(o=>canvas.remove(o)); else canvas.remove(a); persistentSelection=null; }
            }
            const a=canvas.getActiveObject();
            if(a && !a.isEditing) {
                const s=1; 
                switch(e.key){ 
                    case 'ArrowLeft': a.set('left',a.left-s); e.preventDefault(); break; 
                    case 'ArrowRight': a.set('left',a.left+s); e.preventDefault(); break; 
                    case 'ArrowUp': a.set('top',a.top-s); e.preventDefault(); break; 
                    case 'ArrowDown': a.set('top',a.top+s); e.preventDefault(); break; 
                }
                a.setCoords(); canvas.renderAll();
            }
        });

        function getFileName(ext) { const d=document.getElementById('eventDate').value; const n=document.getElementById('eventName').value.trim(); return (d&&n) ? `${d}_${n}.${ext}` : `stage_plan.${ext}`; }
        function saveJSON() { const json=JSON.stringify(canvas.toJSON(PROPERTIES_TO_INCLUDE)); downloadFile(new Blob([json],{type:"application/json"}), getFileName('json')); }
        function loadJSON(input) {
            const f=input.files[0]; if(!f)return;
            const r=new FileReader();
            r.onload=e=>{ 
                isHistoryLocked=true; 
                canvas.loadFromJSON(e.target.result, ()=>{ 
                    restoreBackgroundState(); 
                    history=[JSON.stringify(canvas.toJSON(PROPERTIES_TO_INCLUDE))]; historyStep=0; 
                    isHistoryLocked=false; persistentSelection=null; 
                }); 
            };
            r.readAsText(f); input.value='';
        }
        function saveJPG() { const url=canvas.toDataURL({format:'jpeg', quality:0.8}); const a=document.createElement('a'); a.href=url; a.download=getFileName('jpg'); document.body.appendChild(a); a.click(); document.body.removeChild(a); }
        function downloadFile(b,n) { const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download=n; document.body.appendChild(a); a.click(); document.body.removeChild(a); }
    </script>
</body>
</html>
