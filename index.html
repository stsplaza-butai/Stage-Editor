<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>舞台図面エディター Ver2.9</title>
    <script src="fabric.min.js"></script>
    <script src="jspdf.umd.min.js"></script>
    
    <style>
        /* --- レイアウト定義 --- */
        body { 
            font-family: "Helvetica Neue", Arial, sans-serif; 
            background-color: #cfd8dc; 
            margin: 0; padding: 0; height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* ヘッダー */
        header {
            background: #263238; color: white; padding: 0 15px; 
            display: flex; align-items: center; gap: 15px;
            flex-wrap: wrap; flex-shrink: 0;
            border-bottom: 1px solid #102027; height: 36px;
        }
        header .title { font-weight: bold; font-size: 14px; margin-right: auto; color: #eceff1;}
        .input-group { display: flex; align-items: center; gap: 5px; font-size: 11px; }
        header input { padding: 4px 6px; border-radius: 3px; border: none; font-size: 11px; background: #cfd8dc; color: #333;}
        
        .btn-stamp {
            cursor: pointer; border: 1px solid #b0bec5; background: #eceff1; border-radius: 3px; 
            padding: 4px 8px; font-size: 11px; font-weight: bold; color: #333; transition: 0.1s;
        }
        .btn-stamp:hover { background: #fff; }

        #eventName { width: 180px; } 
        #eventPlace { width: 160px; } 

        /* ツールバー共通設定 */
        .toolbar-row {
            padding: 0 10px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            flex-wrap: wrap; 
            flex-shrink: 0; 
            height: 40px;
            border-bottom: 1px solid #b0bec5;
            box-sizing: border-box;
        }
        .top-toolbar { background: #eceff1; }
        .secondary-toolbar { background: #cfd8dc; height: 38px; }

        .toolbar-group { 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            padding-right: 12px; 
            border-right: 1px solid #90a4ae; 
            height: 100%;
        }
        .toolbar-group:last-child { border-right: none; }
        .group-label { font-size: 10px; color: #455a64; font-weight: bold; margin-right: 5px; white-space: nowrap;}
        
        /* ツールバーボタン */
        .toolbar-row button { 
            cursor: pointer; border: 1px solid #b0bec5; background: white; border-radius: 3px; 
            padding: 0 8px; font-size: 11px; 
            transition: 0.1s; display: flex; align-items: center; gap: 4px; height: 26px; 
        }
        .toolbar-row button:hover { background: #e3f2fd; border-color: #2196f3; }
        
        .btn-blue { color: #0277bd; font-weight: bold; background-color: #e1f5fe !important; border-color: #81d4fa !important;}
        .btn-green { color: #2e7d32; font-weight: bold; background-color: #e8f5e9 !important; border-color: #a5d6a7 !important;}
        .btn-red { color: #c62828; font-weight: bold; background-color: #ffebee !important; border-color: #ef9a9a !important;}
        .btn-resume { color: #e65100; font-weight: bold; background-color: #fff3e0 !important; border-color: #ffcc80 !important;}

        /* --- サイドバー関連 --- */
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }

        .sidebar {
            width: 130px; background: #fff; border-right: 1px solid #ccc;
            padding: 8px; overflow-y: auto; display: flex; flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); flex-shrink: 0; z-index: 10;
        }

        .sub-sidebar {
            width: 130px; background: #fcfcfc; border-right: 1px solid #ccc;
            padding: 8px; overflow-y: auto; display: flex; flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); flex-shrink: 0; z-index: 9;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            margin-left: 0; 
        }
        .sub-sidebar.collapsed { margin-left: -147px; }

        .panel-toggle-btn {
            width: 100%; padding: 8px 4px; margin-bottom: 10px;
            background: #eceff1; border: 1px solid #b0bec5; border-radius: 4px;
            font-size: 11px; font-weight: bold; color: #455a64;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s;
        }
        .panel-toggle-btn:hover { background: #cfd8dc; }
        .panel-toggle-btn.active { background: #fff3e0; border-color: #ffb74d; color: #e65100; }
        
        .section-header { font-size: 10px; font-weight: bold; color: #455a64; margin: 12px 0 4px 0; border-bottom: 1px solid #cfd8dc; padding-bottom: 2px;}

        /* クイックカラーなど */
        .quick-colors { display: grid; grid-template-columns: repeat(6, 18px); gap: 2px; margin-bottom: 5px; }
        .color-chip {
            width: 18px; height: 18px; border: 1px solid #e0e0e0; border-radius: 2px; cursor: pointer;
            font-size: 8px; display: flex; align-items: center; justify-content: center;
        }
        .color-chip:hover { transform: scale(1.3); border-color: #666; z-index: 100; box-shadow: 0 0 4px rgba(0,0,0,0.3);}
        
        .style-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; margin-bottom: 3px;}
        input[type="number"] { width: 35px; padding: 2px; font-size: 10px; }
        input[type="range"] { width: 60px; height: 10px; cursor: pointer; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .item-btn {
            padding: 2px; border: 1px solid #cfd8dc; background: #f8f9fa; border-radius: 4px;
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 4px;
            font-size: 10px; color: #37474f; height: 28px; cursor: pointer; text-align: center;
            box-sizing: border-box; 
            transition: all 0.2s;
        }
        .item-btn:hover { background: #fff3e0; border-color: #ff9800; }
        .item-btn.active {
            background-color: #ffca28 !important;
            color: #000;
            border-color: #ff6f00;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        .item-btn span { font-size: 14px; margin-bottom: 0; }
        .btn-full { width: 100%; }

        .btn-line-style { flex-direction: column !important; gap: 0 !important; height: auto !important; padding: 3px !important; }

        /* キャンバスエリア */
        .canvas-area {
            flex: 1; background-color: #b0bec5; overflow: auto; padding: 20px;
            display: flex; flex-direction: column; align-items: center; gap: 30px;
        }

        .canvas-block {
            background: #fff; border: 1px solid #90a4ae; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            padding: 5px; border-radius: 4px; transition: 0.2s;
        }
        .canvas-block.active {
            border: 3px solid #2196f3; transform: scale(1.005);
            box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
        }

        .block-header {
            display: flex; align-items: center; gap: 10px;
            padding: 5px 10px; background: #eceff1; border-bottom: 1px solid #cfd8dc;
            margin: -5px -5px 5px -5px; border-radius: 4px 4px 0 0;
        }
        .block-ctrl-group { display: flex; align-items: center; gap: 2px; }
        .block-label { font-size: 10px; color: #546e7a; font-weight: bold; margin-right: 4px; }
        
        .btn-mini { font-size: 10px; padding: 2px 6px; cursor: pointer; border: 1px solid #b0bec5; background: white; border-radius: 3px; }
        .btn-mini.active { background: #90caf9; border-color: #42a5f5; font-weight: bold; }
        .btn-mini:hover { background: #e3f2fd; }
        .btn-del { color: #c62828; border-color: #ef9a9a; background: #ffebee; margin-left: auto; }
        .canvas-wrapper { border: 1px solid #000; background: white; }

        .add-canvas-btn {
            padding: 10px; border: 2px dashed #78909c; background: #eceff1; color: #546e7a;
            font-weight: bold; cursor: pointer; text-align: center; border-radius: 5px; margin-bottom: 20px;
        }
        .add-canvas-btn:hover { background: #cfd8dc; border-color: #546e7a; color: #263238; }

        .status-bar {
            background: #263238; color: #eceff1; font-size: 11px; font-family: monospace;
            padding: 0 10px; display: flex; align-items: center; gap: 15px;
            height: 24px; border-top: 1px solid #102027; flex-shrink: 0;
        }
        .status-item { display: flex; align-items: center; gap: 5px; }
        .status-label { color: #b0bec5; }
        .spacer { flex: 1; }
        .save-msg { color: #81d4fa; font-size: 11px; font-weight: bold; opacity: 0; transition: opacity 0.5s; margin-right: 15px; }
        .save-msg.show { opacity: 1; }

        .zoom-ctrl { display: flex; align-items: center; border-left: 1px solid #455a64; padding-left: 10px; }
        .zoom-btn { background: #37474f; border: 1px solid #455a64; color: white; cursor: pointer; padding: 1px 6px; font-size: 10px; border-radius: 3px; }
        .zoom-btn:hover { background: #546e7a; }
        .zoom-val { color: #fff; font-size: 11px; padding: 0 5px; min-width: 35px; text-align: center; }
        
    </style>
</head>
<body>

    <header>
        <div class="title">舞台図面エディター Ver2.9</div>
        <div class="input-group"><label>📅</label><input type="date" id="eventDate"></div>
        <div class="input-group"><label>🏷️</label><input type="text" id="eventName" placeholder="イベント名"></div>
        <div class="input-group"><label>📍</label><input type="text" id="eventPlace" placeholder="場所"></div>
        <button class="btn-stamp" onclick="addStamp()">📝 打刻</button>
    </header>

    <div class="toolbar-row top-toolbar">
        <div class="toolbar-group">
            <span class="group-label">ファイル(JSON)</span>
            <button onclick="saveAllJSON()" class="btn-blue">保存</button>
            <button onclick="document.getElementById('jsonInput').click()">開く</button>
            <button onclick="loadFromAutoSave()" class="btn-resume" title="前回の作業内容を復元">📂 再開</button>
            <input type="file" id="jsonInput" accept=".json" onchange="loadJSON(this)" style="display:none">
        </div>
        <div class="toolbar-group">
            <span class="group-label">書出し</span>
            <button onclick="saveCombinedJPG()" class="btn-green">JPG(連結)</button>
            <button onclick="saveCombinedPDF()" class="btn-red">PDF</button>
        </div>
        
        <div class="toolbar-group">
            <span class="group-label">編集</span>
            <button onclick="copyObject()" title="Ctrl + C">コピー</button>
            <button onclick="pasteObject()" title="Ctrl + V">ペースト</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">履歴</span>
            <button onclick="undo()" title="Ctrl + Z">↩️ 戻す</button>
            <button onclick="redo()" title="Ctrl + Y">↪️ やり直す</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">グループ</span>
            <button onclick="groupObjects()" title="Ctrl + G">🔗 グループ化</button>
            <button onclick="ungroupObjects()" title="Ctrl + Shift + G">🔓 解除</button>
        </div>
    </div>

    <div class="toolbar-row secondary-toolbar">
        <div class="toolbar-group">
            <span class="group-label">整列</span>
            <button onclick="alignObjects('left')">⬅️ 左揃え</button>
            <button onclick="alignObjects('center')">↔️ 左右中央</button>
            <button onclick="alignObjects('right')">➡️ 右揃え</button>
            <button onclick="alignObjects('top')">⬆️ 上揃え</button>
            <button onclick="alignObjects('middle')">↕️ 上下中央</button>
            <button onclick="alignObjects('bottom')">⬇️ 下揃え</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">等間隔</span>
            <button onclick="distributeObjects('x')">↔️ 横方向</button>
            <button onclick="distributeObjects('y')">↕️ 縦方向</button>
        </div>
        <div class="toolbar-group">
            <span class="group-label">順序</span>
            <button onclick="bringToFront()" title="最前面">⬆️最前</button>
            <button onclick="bringForward()" title="前面">↑前</button>
            <button onclick="sendBackwards()" title="背面">↓奥</button>
            <button onclick="sendToBack()" title="最背面">⬇️最奥</button>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <button id="panelToggleBtn" class="panel-toggle-btn active" onclick="toggleSubSidebar()">
                <span>🪑 備品パネル</span>
                <span id="panelToggleIcon">▶</span>
            </button>

            <div class="section-header" style="margin-top:0;">🏟️ 背景</div>
            <div class="grid-2">
                <button id="btn-sideCurtains" onclick="toggleLayer('sideCurtains', addSideCurtains)" class="item-btn" style="background:#ebddf3;">袖幕</button>
                <button id="btn-daikoku" onclick="toggleLayer('daikoku', addDaikokuMaku)" class="item-btn" style="background:#c8a1e0;">大黒幕</button>
                <button id="btn-nakawari" onclick="toggleLayer('nakawari', addNakawariMaku)" class="item-btn" style="background:#d5bfe4;">中割幕</button>
                <button id="btn-doncho" onclick="toggleLayer('doncho', addDoncho)" class="item-btn" style="background:#c8e6c9;">緞帳</button>
                <button id="btn-reflect" onclick="toggleLayer('reflect', addReflectingBoard)" class="item-btn" style="background:#fff9c4;">反響板</button>
                <button id="btn-retractable" onclick="toggleLayer('retractable', addRetractableSeating)" class="item-btn" style="background:#ffab91;"><span style="font-size:9px;">移動観覧席</span></button>
                <button id="btn-battens" onclick="toggleLayer('battens', addBattens)" class="item-btn" style="background:#b3e5fc;">吊バトン</button>
                <button id="btn-lighting" onclick="toggleLayer('lighting', addLightingBattens)" class="item-btn" style="background:#fff59d;"><span style="font-size:9px;">照明バトン</span></button>
            </div>
            
            <div class="section-header">🏠 セット配置</div>
            <div class="grid-2">
                <button onclick="addFrontAudience()" class="item-btn" style="background:#ffccbc;">客席 (前)</button>
                <button onclick="addLightingBasic()" class="item-btn" style="background:#fff176;">照明基本</button>
            </div>

            <div class="section-header">🎨 塗り</div>
            <div class="quick-colors">
                <div class="color-chip" style="background:transparent; border:1px dashed #f00;" onclick="applyStyle('fill', 'transparent')" title="透明">🚫</div>
                <div class="color-chip" style="background:#ffffff;" onclick="applyStyle('fill', '#ffffff')" title="白"></div>
                <div class="color-chip" style="background:#bdbdbd;" onclick="applyStyle('fill', '#bdbdbd')" title="灰"></div>
                <div class="color-chip" style="background:#000000;" onclick="applyStyle('fill', '#000000')" title="黒"></div>
                <div class="color-chip" style="background:#e53935;" onclick="applyStyle('fill', '#e53935')" title="赤"></div>
                <div class="color-chip" style="background:#1e88e5;" onclick="applyStyle('fill', '#1e88e5')" title="青"></div>
                <div class="color-chip" style="background:#43a047;" onclick="applyStyle('fill', '#43a047')" title="緑"></div>
                <div class="color-chip" style="background:#fdd835;" onclick="applyStyle('fill', '#fdd835')" title="黄"></div>
                <div class="color-chip" style="background:#795548;" onclick="applyStyle('fill', '#795548')" title="茶"></div>
                <div class="color-chip" style="background:#8e24aa;" onclick="applyStyle('fill', '#8e24aa')" title="紫"></div>
                <div class="color-chip" style="background:#ffcdd2;" onclick="applyStyle('fill', '#ffcdd2')" title="薄赤"></div>
                <div class="color-chip" style="background:#bbdefb;" onclick="applyStyle('fill', '#bbdefb')" title="水色"></div>
                <div class="color-chip" style="background:#c8e6c9;" onclick="applyStyle('fill', '#c8e6c9')" title="薄緑"></div>
                <div class="color-chip" style="background:#ffe0b2;" onclick="applyStyle('fill', '#ffe0b2')" title="薄橙"></div>
                <div class="color-chip" style="background:#cfd8dc;" onclick="applyStyle('fill', '#cfd8dc')" title="薄灰"></div>
                <div class="color-chip" style="background:#fff9c4;" onclick="applyStyle('fill', '#fff9c4')" title="薄黄"></div>
                <div class="color-chip" style="background:#e0e0e0;" onclick="applyStyle('fill', '#e0e0e0')" title="薄灰2"></div>
                <div class="color-chip" style="background:#546e7a;" onclick="applyStyle('fill', '#546e7a')" title="濃灰"></div>
            </div>

            <div class="section-header">✏️ 線</div>
             <div class="quick-colors">
                <div class="color-chip" style="background:transparent; border:1px dashed #ccc;" onclick="applyStyle('stroke', 'transparent')" title="なし">🚫</div>
                <div class="color-chip" style="background:#ffffff;" onclick="applyStyle('stroke', '#ffffff')" title="白"></div>
                <div class="color-chip" style="background:#bdbdbd;" onclick="applyStyle('stroke', '#bdbdbd')" title="灰"></div>
                <div class="color-chip" style="background:#000000;" onclick="applyStyle('stroke', '#000000')" title="黒"></div>
                <div class="color-chip" style="background:#e53935;" onclick="applyStyle('stroke', '#e53935')" title="赤"></div>
                <div class="color-chip" style="background:#1e88e5;" onclick="applyStyle('stroke', '#1e88e5')" title="青"></div>
            </div>
            
            <div class="style-row" style="margin-top:5px;">
                <span>太さ:</span>
                <input type="number" id="strokeWidth" min="0" max="20" value="1" oninput="applyStyle('strokeWidth', parseInt(this.value))">
            </div>
            <div class="grid-2" style="margin-top:4px;">
                <button class="item-btn btn-line-style" onclick="applyLineStyle('solid')">
                    <span style="font-size:12px; line-height:1;">────</span><span style="font-size:10px;">実線</span>
                </button>
                <button class="item-btn btn-line-style" onclick="applyLineStyle('dashed')">
                    <span style="font-size:12px; line-height:1;">- - - -</span><span style="font-size:10px;">点線</span>
                </button>
            </div>

            <div class="section-header">💧 透明度</div>
            <div class="style-row" style="justify-content: flex-end;">
                <input type="number" id="opacityInput" min="0" max="100" value="100" step="10" oninput="applyOpacity(this.value)" style="width:40px;">
            </div>
            
            <div class="section-header">🔤 文字</div>
            <button class="item-btn btn-full" style="margin-bottom:4px;" onclick="addText()"><span>📝</span>文字を追加</button>
            <div class="style-row">
                <span>サイズ:</span>
                <input type="number" id="fontSizeInput" min="1" max="200" value="20" oninput="applyStyle('fontSize', parseInt(this.value))">
            </div>

            <div class="section-header">📐 記号</div>
            <div class="grid-2">
                <button class="item-btn" onclick="addLine()"><span>➖</span>線</button>
                <button class="item-btn" onclick="addArrow()"><span>➡️</span>矢印</button>
                <button class="item-btn" onclick="addRectShape()"><span>⬜</span>四角</button>
                <button class="item-btn" onclick="addCircleShape()"><span>⚪</span>丸</button>
                <button class="item-btn" onclick="addDottedCircle()"><span>⭕</span>点丸</button>
                <button class="item-btn" onclick="addWaveLine()"><span>〰️</span>波線</button>
            </div>
        </div>
        
        <div class="sub-sidebar" id="subSidebar">
            <div class="section-header" style="margin-top:0;">🖼️ 画像</div>
            <button onclick="document.getElementById('objImgInput').click()" class="item-btn btn-full" style="margin-top:5px; background:#fdffe2;">✨ 画像を追加</button>
            <input type="file" id="objImgInput" accept="image/*" onchange="addImageObject(this)" style="display:none">

            <div class="section-header">🪑 備品</div>
            <div class="grid-2">
                <button class="item-btn" onclick="addPiano()">🎹 ピアノ</button>
                <button class="item-btn" onclick="addChair()">🪑 イス</button>
                <button class="item-btn" onclick="addSignboard()">🪧 横看板</button>
                <button class="item-btn" onclick="addHangingBanner()">📜 懸垂幕</button>
                <button class="item-btn" onclick="addDeskStage()">🟨 長机(大)</button>
                <button class="item-btn" onclick="addDesk()">🟨 長机</button>
                <button class="item-btn" onclick="addPodium()">🟫 演台</button>
                <button class="item-btn" onclick="addEmceeDesk()">🟫 司会台</button>
                <button class="item-btn" onclick="addFlowerStand()">🪴 花台</button>
                <button class="item-btn" onclick="addPlatform46()">🟧 平台46</button>
                <button class="item-btn" onclick="addPlatform36()">🟧 平台36</button>
                <button class="item-btn" onclick="addPlatform26()">🟧 平台26</button>
                <button class="item-btn" onclick="addStairs()">🪜 階段</button>
                <button class="item-btn" onclick="addConductor()">🎼 指揮台</button>
                <button class="item-btn" onclick="addGoldScreen()">✨ 金屏風</button>
                <button class="item-btn" onclick="addStand()">🎼 譜面台</button>
            </div>
        
           
            <div class="section-header">🎵 音響記号</div>
            <div class="grid-2">
                <button class="item-btn" onclick="addPerson()">👤 人物</button>
                <button class="item-btn" onclick="addMic()">🎤 マイク</button>
                <button class="item-btn" onclick="addStandMic()">🎤 STマイク</button>
                <button class="item-btn" onclick="addWLMic()">⚡ WLマイク</button>
                <button class="item-btn" onclick="addSpeaker()">🔊 SP</button>
            </div>
            <div class="section-header">💡 照明記号</div>
            <div class="grid-2">    
                <button class="item-btn" onclick="addLH()">🌈 LH</button>
                <button class="item-btn" onclick="addConvex()">🔦 凸</button>
                <button class="item-btn" onclick="addFresnel()">🔦 フレネル</button>
                <button class="item-btn" onclick="addPar()">🔦 Par</button>
                <button class="item-btn" onclick="addLikuri()">🔦 リクリ</button>
                <button class="item-btn" onclick="addCommonLine()">┻ コンモ線</button>
            </div>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <div style="display:flex; gap:10px; width:840px; margin-bottom:20px;">
                <button class="add-canvas-btn" onclick="addNewCanvasBlock()" style="flex:1; margin-bottom:0;">➕ 図面を追加</button>
                <button class="add-canvas-btn" onclick="addMeetingCanvasBlock()" style="flex:1; margin-bottom:0; background:#e0f2f1; color:#00695c; border-color:#009688;">📋 打合せ表を追加</button>
                <button class="add-canvas-btn" onclick="duplicateActiveCanvas()" style="flex:1; margin-bottom:0; background:#fff9c4; color:#ef6c00; border-color:#ff9800;">📑 選択中のキャンバスを複製</button>
            </div>
        </div>
    </div>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-label">アクティブ:</span>
            <span id="activeCanvasName">なし</span>
        </div>
        <div class="status-item">
            <span class="status-label">🖱️</span>
            <span id="mouseCoords">X: 0 Y: 0</span>
        </div>
        <div class="status-item">
            <span class="status-label">📏</span>
            <span id="objSize" style="min-width: 80px;">W: - H: -</span>
            <span id="objAngle" style="margin-left: 10px; min-width: 40px;">R: -</span>
        </div>
        
        <div class="spacer"></div> 
        
        <span id="saveStatus" class="save-msg">自動保存しました</span>

        <div class="zoom-ctrl">
            <button class="zoom-btn" onclick="changeZoom(-0.1)">🔍-</button>
            <span class="zoom-val" id="zoomVal">50%</span>
            <button class="zoom-btn" onclick="changeZoom(0.1)">🔍+</button>
        </div>
    </div>

    <script>
        // オブジェクトを画像としてキャッシュしない（常にベクターとして描画する＝くっきりする）
        fabric.Object.prototype.objectCaching = false;
        const DEFAULT_FONT = 'Arial';
        const PROPERTIES_TO_INCLUDE = [
            'id', 'isBackground', 'selectable', 'evented', 'strokeDashArray', 
            'lockScalingX', 'lockScalingY', 'layerId', 'strokeUniform',
            'lockMovementX', 'lockMovementY', 'hasControls', 'hoverCursor', 
            'isCell', 'colorType', 'cellState', 
            'isPermanent', 'isCheckboxBox', 'isCheckMark', 'checkboxId'
        ];
        const BASE_WIDTH = 840;
        const LS_KEY = 'stage_editor_autosave_v2';
        
        let canvasList = []; 
        let activeCanvasId = null;
        let _clipboard = null;
        
        let hasUnsavedChanges = false;
        const AUTO_SAVE_INTERVAL = 30000;

        window.onload = function() {
            addNewCanvasBlock('メイン図面');
            setInterval(checkAndAutoSave, AUTO_SAVE_INTERVAL);
        };

        function checkAndAutoSave() {
            if (!hasUnsavedChanges || canvasList.length === 0) return;
            saveToAutoSave();
            hasUnsavedChanges = false;
            showSaveStatus();
        }

        function saveToAutoSave() {
            const dataToSave = {
                meta: {
                    date: document.getElementById('eventDate').value,
                    name: document.getElementById('eventName').value,
                    place: document.getElementById('eventPlace').value
                },
                canvases: canvasList.map(c => ({
                    height: c.heightState,
                    json: c.canvasObj.toJSON(PROPERTIES_TO_INCLUDE)
                }))
            };
            try { localStorage.setItem(LS_KEY, JSON.stringify(dataToSave)); } catch (e) { console.warn(e); }
        }

        function showSaveStatus() {
            const el = document.getElementById('saveStatus');
            el.classList.add('show');
            setTimeout(() => { el.classList.remove('show'); }, 2000);
        }

        function markUnsaved() { hasUnsavedChanges = true; }

        function loadFromAutoSave() {
            const savedData = localStorage.getItem(LS_KEY);
            if (!savedData) { alert('前回の保存データが見つかりません。'); return; }
            if(!confirm('現在作業中の内容は破棄され、前回の続きから再開します。\nよろしいですか？')) return;

            try {
                const content = JSON.parse(savedData);
                canvasList.forEach(c => { c.canvasObj.dispose(); c.blockElement.remove(); });
                canvasList = []; activeCanvasId = null;

                if(content.meta) {
                    if(content.meta.date) document.getElementById('eventDate').value = content.meta.date;
                    if(content.meta.name) document.getElementById('eventName').value = content.meta.name;
                    if(content.meta.place) document.getElementById('eventPlace').value = content.meta.place;
                }
                if(content.canvases && content.canvases.length > 0) {
                    importData(content.canvases);
                } else {
                    addNewCanvasBlock('メイン図面');
                }
                hasUnsavedChanges = false;
            } catch(e) {
                console.error('復元エラー:', e); alert('データの復元に失敗しました。');
            }
        }

        document.getElementById('eventDate').addEventListener('change', markUnsaved);
        document.getElementById('eventName').addEventListener('input', markUnsaved);
        document.getElementById('eventPlace').addEventListener('input', markUnsaved);

        function toggleSubSidebar() {
            const sub = document.getElementById('subSidebar');
            const btn = document.getElementById('panelToggleBtn');
            const icon = document.getElementById('panelToggleIcon');
            sub.classList.toggle('collapsed');
            if(sub.classList.contains('collapsed')) {
                btn.classList.remove('active'); icon.textContent = '▶';
            } else {
                btn.classList.add('active'); icon.textContent = '◀';
            }
        }

        // --- キャンバス追加・管理 ---
        function addNewCanvasBlock(title = '新規図面') {
            const id = 'canvas_' + Date.now();
            const container = document.getElementById('canvasContainer');
            const addBtnContainer = container.querySelector('div[style*="display:flex"]');

            const block = document.createElement('div');
            block.className = 'canvas-block';
            block.id = 'block_' + id;
            block.innerHTML = `
                <div class="block-header">
                    <div class="block-ctrl-group">
                        <span class="block-label">図面エリア:</span>
                        <button class="btn-mini btn-size" onclick="setCanvasHeight('${id}', 500, this)">舞台</button>
                        <button class="btn-mini btn-size" onclick="setCanvasHeight('${id}', 1000, this)">＋客席前方</button>
                        <button class="btn-mini btn-size" onclick="setCanvasHeight('${id}', 1650, this)">＋客席後方</button>
                    </div>
                    <label style="font-size:11px; margin-left:10px; cursor:pointer;">
                        <input type="checkbox" id="chk_${id}" checked> 🖨️ 印刷
                    </label>
                    <button class="btn-mini btn-del" onclick="deleteCanvasBlock('${id}')">🗑️ 削除</button>
                </div>
                <div class="canvas-wrapper" onclick="activateCanvas('${id}')">
                    <canvas id="${id}" width="840" height="500"></canvas>
                </div>
            `;
            
            container.insertBefore(block, addBtnContainer); 

            const fCanvas = new fabric.Canvas(id, { preserveObjectStacking: true });
            fCanvas.backgroundColor = "white";
            
            fCanvas.setZoom(1); 
            
            const canvasData = {
                id: id,
                canvasObj: fCanvas,
                history: [],
                historyStep: -1,
                isHistoryLocked: false,
                heightState: 500,
                blockElement: block
            };
            canvasList.push(canvasData);

            drawDefaultBackground(fCanvas, 500);
            updateHeightButtons(id, 500);
            
            fCanvas.setDimensions({ width: BASE_WIDTH, height: 500 });
            
            setupCanvasEvents(fCanvas, id);
            activateCanvas(id);
            saveHistory(id); 
            
            document.getElementById('zoomVal').textContent = '100%';
        }

        function addMeetingCanvasBlock() {
            const id = 'canvas_' + Date.now();
            const container = document.getElementById('canvasContainer');
            const addBtnContainer = container.querySelector('div[style*="display:flex"]');

            const block = document.createElement('div');
            block.className = 'canvas-block';
            block.id = 'block_' + id;
            
            block.innerHTML = `
                <div class="block-header" style="background:#e0f2f1; border-bottom:1px solid #b2dfdb;">
                    <div class="block-ctrl-group">
                        <span class="block-label" style="color:#00695c; font-size:14px;">📋 打合せ表</span>
                    </div>
                    
                    <label style="font-size:11px; margin-left:15px; cursor:pointer;">
                        <input type="checkbox" id="chk_${id}" checked> 🖨️ 印刷
                    </label>

                    <span style="font-size:11px; margin-left:15px; color:#555;">
                        <span style="display:inline-block; width:10px; height:10px; background:#c8e6c9; border:1px solid #999; margin-right:2px; vertical-align:middle;"></span>通常
                        <span style="display:inline-block; width:10px; height:10px; background:#ffcdd2; border:1px solid #999; margin-left:8px; margin-right:2px; vertical-align:middle;"></span>倍額
                    </span>

                    <button class="btn-mini btn-del" onclick="deleteCanvasBlock('${id}')">🗑️ 削除</button>
                </div>
                <div class="canvas-wrapper" onclick="activateCanvas('${id}')">
                    <canvas id="${id}" width="840" height="1188"></canvas>
                </div>
            `;
            
            container.insertBefore(block, addBtnContainer); 

            const fCanvas = new fabric.Canvas(id, { preserveObjectStacking: true });
            fCanvas.backgroundColor = "white";
            fCanvas.setZoom(1); 
            
            const canvasData = {
                id: id,
                canvasObj: fCanvas,
                history: [],
                historyStep: -1,
                isHistoryLocked: false,
                heightState: 1188,
                blockElement: block,
                isMeetingSheet: true
            };
            canvasList.push(canvasData);

            drawMeetingTable(fCanvas);
            
            fCanvas.setDimensions({ width: 840, height: 1188 });
            setupCanvasEvents(fCanvas, id);
            activateCanvas(id);
            saveHistory(id); 
            
            document.getElementById('zoomVal').textContent = '100%';
        }

        // --- ヘルパー関数：チェックボックスの列を描画 ---
        function drawCheckboxRow(cvs, startX, startY, items) {
            let currentX = startX;
            items.forEach(label => {
                const uid = 'cb_' + Date.now() + '_' + Math.random();
                const box = new fabric.Rect({
                    left: currentX, top: startY, width: 14, height: 14,
                    fill: 'white', stroke: 'black', strokeWidth: 1,
                    selectable: false, evented: true, hoverCursor: 'pointer',
                    isPermanent: true, isCheckboxBox: true, checkboxId: uid
                });
                const mark = new fabric.Text('✔', {
                    left: currentX + 1, top: startY - 2, fontSize: 14, fill: 'black',
                    selectable: false, evented: false, visible: false,
                    isPermanent: true, isCheckMark: true, checkboxId: uid
                });
                const text = new fabric.Text(label, {
                    left: currentX + 18, top: startY + 1, fontSize: 12, fill: 'black',
                    fontFamily: DEFAULT_FONT, selectable: false, evented: false,
                    isPermanent: true
                });
                cvs.add(box); cvs.add(mark); cvs.add(text);
                currentX += (18 + text.width + 10);
            });
        }

        function drawMeetingTable(cvs) {
            const HEADER_H = 60; const ROW_H = 15; const ROWS_COUNT = 60; const TIME_TABLE_W = 400; const TECH_COL_W = 440;
            const borderStyle = { stroke: '#000', strokeWidth: 1, selectable: false, evented: false };
            const textStyle = { fontFamily: DEFAULT_FONT, fill: '#000', selectable: false, evented: false };
            const headerFill = '#bdbdbd'; 

            const colWidths = [30, 30, 200, 30, 30, 20, 20, 20, 20];
            const headerTexts = ["区", "時", "内容", "ホ", "多", "A", "B", "C", "D"];
            let currentX = 0;
            colWidths.forEach((w, i) => {
                cvs.add(new fabric.Rect({ left: currentX, top: 0, width: w, height: HEADER_H, fill: headerFill, ...borderStyle }));
                cvs.add(new fabric.Text(headerTexts[i], { left: currentX + w/2, top: HEADER_H/2, fontSize: 14, originX:'center', originY:'center', ...textStyle }));
                currentX += w;
            });

            const zoneGroups = [ { start: 0, len: 6, text: "前延長" }, { start: 6, len: 12, text: "午前" }, { start: 18, len: 4, text: "" }, { start: 22, len: 16, text: "午後" }, { start: 38, len: 4, text: "" }, { start: 42, len: 18, text: "夜間" } ];
            const xPos = [0]; for(let i=0; i<colWidths.length; i++) xPos.push(xPos[i] + colWidths[i]);

            for (let r = 0; r < ROWS_COUNT; r++) {
                const topY = HEADER_H + (r * ROW_H);
                const zone = zoneGroups.find(z => z.start === r);
                if (zone) {
                    const h = zone.len * ROW_H;
                    cvs.add(new fabric.Rect({ left: xPos[0], top: topY, width: colWidths[0], height: h, fill: 'white', ...borderStyle }));
                    const vertText = zone.text.split('').join('\n');
                    cvs.add(new fabric.Text(vertText, { left: xPos[0] + colWidths[0]/2, top: topY + h/2, fontSize: 12, originX:'center', originY:'center', ...textStyle }));
                }
                cvs.add(new fabric.Rect({ left: xPos[1], top: topY, width: colWidths[1] + colWidths[2], height: ROW_H, fill: 'white', stroke: '#f5f5f5', strokeWidth: 1, selectable: false, evented: true, hoverCursor: 'pointer', isCell: true, colorType: 'Content' }));
                if ((r - 2) % 4 === 0) {
                    const hour = 8 + (r - 2) / 4;
                    if (hour <= 22) {
                        cvs.add(new fabric.Text(`${hour}:00`, { left: xPos[1] + colWidths[1]/2, top: topY, fontSize: 10, originX:'center', originY:'center', backgroundColor:'transparent', ...textStyle }));
                    }
                }
                if (zone) {
                    const h = zone.len * ROW_H;
                    for (let c = 3; c <= 8; c++) {
                        cvs.add(new fabric.Rect({ left: xPos[c], top: topY, width: colWidths[c], height: h, fill: 'white', stroke: 'black', strokeWidth: 1, selectable: false, evented: true, hoverCursor: 'pointer', isCell: true, colorType: 'Checkbox' }));
                    }
                }
            }
            
            const tableBottomY = HEADER_H + (ROWS_COUNT * ROW_H);
            cvs.add(new fabric.Line([xPos[1], HEADER_H, xPos[3], HEADER_H], { stroke: 'black', strokeWidth: 1, selectable:false, evented:false }));
            cvs.add(new fabric.Line([xPos[1], HEADER_H, xPos[1], tableBottomY], { stroke: 'black', strokeWidth: 1, selectable:false, evented:false }));
            cvs.add(new fabric.Line([xPos[3], HEADER_H, xPos[3], tableBottomY], { stroke: 'black', strokeWidth: 1, selectable:false, evented:false }));
            cvs.add(new fabric.Line([xPos[1], tableBottomY, xPos[3], tableBottomY], { stroke: 'black', strokeWidth: 1, selectable:false, evented:false }));
            cvs.add(new fabric.Line([0, tableBottomY, TIME_TABLE_W, tableBottomY], { stroke: 'black', strokeWidth: 1, selectable:false, evented:false }));

            const contentLines = "\n".repeat(118); 
            cvs.add(new fabric.Textbox(contentLines, {
                left: 60 + 10, top: HEADER_H, width: 180 - 10, height: 960, 
                fontSize: 14, lineHeight: 0.475, fontFamily: DEFAULT_FONT, fill: '#000',
                splitByGrapheme: true, backgroundColor: 'transparent',
                lockMovementX: true, lockMovementY: true, lockScalingX: true, lockScalingY: true,
                hasControls: false, hoverCursor: 'text', isPermanent: true 
            }));

            const techH = 240;
            const techSections = [
                { label: "舞台", y: 0, items: ["緞帳", "バトン操作", "ピアノ調律", "吊り物あり", "プラザ枠"] },
                { label: "音響", y: 240, items: ["叩き", "録音", "音声送り"] },
                { label: "照明", y: 480, items: ["講演会", "要望"] },
                { label: "映像", y: 720, items: ["調整室PJ", "動画あり"] }
            ];
            
            techSections.forEach((sec, i) => {
                const topY = sec.y;
                cvs.add(new fabric.Rect({ left: TIME_TABLE_W, top: topY, width: TECH_COL_W, height: techH, fill: 'white', ...borderStyle }));
                cvs.add(new fabric.Text(sec.label, { left: TIME_TABLE_W + 5, top: topY + 5, fontSize: 15, ...textStyle }));
                drawCheckboxRow(cvs, TIME_TABLE_W + 50, topY + 15, sec.items);
                
                const techLines = "\n".repeat(9);
                cvs.add(new fabric.Textbox(techLines, {
                    left: TIME_TABLE_W + 15, top: topY + 45, width: TECH_COL_W - 30, 
                    fontSize: 14, fontFamily: DEFAULT_FONT, fill: '#000',
                    splitByGrapheme: true, lockMovementX: true, lockMovementY: true, lockScalingX: true, lockScalingY: true,
                    hasControls: false, hoverCursor: 'text', isPermanent: true 
                }));
            });

            const REMARKS_Y = 960; const REMARKS_H = 1188 - 960;
            cvs.add(new fabric.Rect({ left: 0, top: REMARKS_Y, width: 840, height: REMARKS_H, fill: 'white', ...borderStyle }));
            cvs.add(new fabric.Text("備考", { left: 5, top: REMARKS_Y + 5, fontSize: 15, ...textStyle }));
            drawCheckboxRow(cvs, 50, REMARKS_Y + 15, ["空調指定", "ホワイエ販売", "２階展示ボード", "後納"]);
            
            const remarkLines = "\n".repeat(9);
            cvs.add(new fabric.Textbox(remarkLines, {
                left: 5 + 5, top: REMARKS_Y + 45, width: 840 - 30, 
                fontSize: 14, fontFamily: DEFAULT_FONT, fill: '#000',
                splitByGrapheme: true, lockMovementX: true, lockMovementY: true, lockScalingX: true, lockScalingY: true,
                hasControls: false, hoverCursor: 'text', isPermanent: true 
            }));

            cvs.add(new fabric.Rect({ left: 1, top: 1, width: 840 - 2, height: 1188 - 2, fill: 'transparent', stroke: 'black', strokeWidth: 1, selectable: false, evented: false }));
            cvs.requestRenderAll();
        }

        function deleteCanvasBlock(id) {
            if(!confirm('この図面を削除しますか？')) return;
            const idx = canvasList.findIndex(c => c.id === id);
            if(idx > -1) {
                canvasList[idx].canvasObj.dispose(); canvasList[idx].blockElement.remove(); canvasList.splice(idx, 1);
                if(activeCanvasId === id) { activeCanvasId = null; document.getElementById('activeCanvasName').textContent = 'なし'; }
                markUnsaved(); 
            }
        }

        function activateCanvas(id) {
            activeCanvasId = id;
            document.querySelectorAll('.canvas-block').forEach(b => b.classList.remove('active'));
            const idx = canvasList.findIndex(c => c.id === id);
            if (idx > -1) {
                const target = canvasList[idx];
                target.blockElement.classList.add('active');
                document.getElementById('activeCanvasName').textContent = `キャンバス ${idx + 1}`;
                const zoomVal = target.canvasObj.getZoom();
                document.getElementById('zoomVal').textContent = Math.round(zoomVal * 100) + '%';
                updateLayerButtonStates();
            }
        }

        function getActiveCanvas() { if(!activeCanvasId && canvasList.length > 0) activateCanvas(canvasList[0].id); return canvasList.find(c => c.id === activeCanvasId)?.canvasObj; }
        function getCanvasData(id) { return canvasList.find(c => c.id === id); }

        function setCanvasHeight(id, height, btn) {
            const data = canvasList.find(c => c.id === id);
            if(!data) return;
            data.heightState = height;
            if (!data.isMeetingSheet) {
                let newZoom = 1;
                if (height === 500) newZoom = 1; else if (height === 1000) newZoom = 0.8; else if (height === 1650) newZoom = 0.5;
                data.canvasObj.setZoom(newZoom);
                if (activeCanvasId === id) { document.getElementById('zoomVal').textContent = Math.round(newZoom * 100) + '%'; }
            }
            const curZoom = data.canvasObj.getZoom();
            data.canvasObj.setDimensions({ width: BASE_WIDTH * curZoom, height: height * curZoom });
            if(data.isMeetingSheet) {
                data.canvasObj.clear(); data.canvasObj.backgroundColor = "white"; drawMeetingTable(data.canvasObj);
            } else {
                drawDefaultBackground(data.canvasObj, height);
            }
            updateHeightButtons(id, height); activateCanvas(id); saveHistory(id);
        }

        function updateHeightButtons(id, height) {
            const block = document.getElementById('block_' + id); const btns = block.querySelectorAll('.btn-size'); btns.forEach(b => b.classList.remove('active'));
            if(height === 500) btns[0].classList.add('active'); else if(height === 1000 || height === 1188) btns[1].classList.add('active'); else if(height === 1650) btns[2].classList.add('active');
        }

        function setupCanvasEvents(cvs, id) {
            cvs.on('object:added', (e) => { if(!e.target.excludeFromExport && !getCanvasData(id).isBatchDrawing) saveHistory(id); });
            cvs.on('object:modified', () => saveHistory(id));
            cvs.on('object:removed', () => { if(!getCanvasData(id).isBatchDrawing) saveHistory(id); });
            cvs.on('mouse:move', (opt) => { if(id === activeCanvasId) { const p = cvs.getPointer(opt.e); document.getElementById('mouseCoords').textContent = `X: ${Math.round(p.x)} Y: ${Math.round(p.y)}`; } });
            cvs.on('selection:created', updateObjStatus); cvs.on('selection:updated', updateObjStatus); cvs.on('selection:cleared', updateObjStatus); cvs.on('object:modified', updateObjStatus); cvs.on('object:rotating', updateObjStatus);
            cvs.on('mouse:down', function(opt) {
                if(activeCanvasId !== id) activateCanvas(id);
                if (opt.target && opt.target.isCheckboxBox) {
                    const uid = opt.target.checkboxId; const objects = cvs.getObjects(); const mark = objects.find(o => o.isCheckMark && o.checkboxId === uid);
                    if (mark) { mark.set('visible', !mark.visible); cvs.requestRenderAll(); saveHistory(id); } return; 
                }
                if (opt.target && opt.target.isCell) {
                    const type = opt.target.colorType; const curr = opt.target.fill; let nextColor = 'white';
                    if (type === 'Content') { if (curr === 'white') nextColor = '#fff9c4'; else nextColor = 'white'; } 
                    else if (type === 'Checkbox') { if (curr === 'white') nextColor = '#c8e6c9'; else if (curr === '#c8e6c9') nextColor = '#ffcdd2'; else nextColor = 'white'; }
                    opt.target.set('fill', nextColor); cvs.requestRenderAll(); saveHistory(id); return; 
                }
                if(opt.target) { opt.target._startLeft = opt.target.left; opt.target._startTop = opt.target.top; }
            });
            cvs.on('object:moving', function(opt) {
                const target = opt.target;
                if (target && opt.e.shiftKey) {
                    const dx = Math.abs(target.left - target._startLeft); const dy = Math.abs(target.top - target._startTop);
                    if (dx > dy) target.set('top', target._startTop); else target.set('left', target._startLeft);
                }
            });
            cvs.on('mouse:wheel', function(opt) {
                if (opt.e.ctrlKey || opt.e.metaKey) { opt.e.preventDefault(); opt.e.stopPropagation(); const delta = opt.e.deltaY < 0 ? 0.1 : -0.1; changeZoom(delta); }
            });
        }

        function saveHistory(id) {
            const data = getCanvasData(id); if(!data || data.isHistoryLocked || data.isBatchDrawing) return;
            if (data.historyStep < data.history.length - 1) { data.history = data.history.slice(0, data.historyStep + 1); }
            data.history.push(JSON.stringify(data.canvasObj.toJSON(PROPERTIES_TO_INCLUDE)));
            data.historyStep++; if (data.history.length > 30) { data.history.shift(); data.historyStep--; }
            updateLayerButtonStates(); markUnsaved();
        }

        function undo() {
            const id = activeCanvasId; const data = getCanvasData(id);
            if (data && data.historyStep > 0) {
                data.isHistoryLocked = true; data.historyStep--;
                data.canvasObj.loadFromJSON(data.history[data.historyStep], function() { restoreBackgroundState(data.canvasObj); data.isHistoryLocked = false; updateObjStatus(); markUnsaved(); });
            }
        }
        function redo() {
            const id = activeCanvasId; const data = getCanvasData(id);
            if (data && data.historyStep < data.history.length - 1) {
                data.isHistoryLocked = true; data.historyStep++;
                data.canvasObj.loadFromJSON(data.history[data.historyStep], function() { restoreBackgroundState(data.canvasObj); data.isHistoryLocked = false; updateObjStatus(); markUnsaved(); });
            }
        }

        function addStamp() {
            const d = document.getElementById('eventDate').value; const n = document.getElementById('eventName').value; const p = document.getElementById('eventPlace').value;
            const textContent = `Date: ${d}  /  Event: ${n}  /  Place: ${p}`;
            const data = getCanvasData(activeCanvasId); if(!data) return;

        function createWaveLine(x, y, len, color, layerId) { const offsetX = 20; let startX = x + offsetX; let d = `M ${startX} ${y}`; const waveStep = 10; const amp = 5; for (let i = 0; i < len; i += waveStep) { const nextX = startX + i + waveStep; const targetX = (nextX > startX + len) ? startX + len : nextX; const cpX = startX + i + (waveStep / 2); const cpY = ( (i / waveStep) % 2 === 0 ) ? y - amp : y + amp; d += ` Q ${cpX} ${cpY} ${targetX} ${y}`; } return new fabric.Path(d, { stroke: color, strokeWidth: 1, fill: 'transparent', selectable: false, evented: false, isBackground: true, layerId: layerId }); }

                    const cpX = startRight + i + (waveStep/2); const cpY = ((i/waveStep)%2===0) ? c.y-amp : c.y+amp;
                    dRight += ` Q ${cpX} ${cpY} ${targetX} ${c.y}`;

                if (active.strokeWidth !== undefined) document.getElementById('strokeWidth').value = active.strokeWidth;
                if (active.opacity !== undefined) document.getElementById('opacityInput').value = Math.round(active.opacity * 100);
                const rep = (active.type === 'activeSelection') ? active.getObjects()[0] : active;

        function saveCombinedJPG() { 
            const targets = canvasList.filter(c => { const chk = document.getElementById('chk_' + c.id); return chk && chk.checked; }); 
            if(targets.length === 0) return; 
            
            const GAP = 30; // ▼隙間のサイズ（ここをいじれば間隔を変えられます）

            let totalH = 0; 
            targets.forEach(c => totalH += c.heightState); 
            
            // ▼合計の高さに「隙間ぶん」を追加（画像の枚数-1 箇所に隙間が入る）
            if (targets.length > 1) {
                totalH += (targets.length - 1) * GAP;
            }
            
            const w = BASE_WIDTH; 
            const comboCanvas = document.createElement('canvas'); 
            comboCanvas.width = w; 
            comboCanvas.height = totalH; 
            
            const ctx = comboCanvas.getContext('2d'); 
            ctx.fillStyle = '#ffffff'; 
            ctx.fillRect(0, 0, w, totalH); 
            
            const promises = targets.map(c => { 
                return new Promise(resolve => { 
                    const img = new Image(); 
                    img.onload = () => resolve({ img, h: c.heightState }); 
                    const curZoom = c.canvasObj.getZoom(); 
                    const targetMultiplier = 1.0 / curZoom; 
                    img.src = c.canvasObj.toDataURL({ format: 'png', multiplier: targetMultiplier }); 
                }); 
            }); 
            
            Promise.all(promises).then(images => { 
                let y = 0; 
                images.forEach((item, index) => { 
                    ctx.drawImage(item.img, 0, y, w, item.h); 
                    // ▼次の画像の描き始め位置を「今の画像の高さ + 隙間」分ずらす
                    y += item.h + GAP; 
                }); 
                
                const d=document.getElementById('eventDate').value; 
                const n=document.getElementById('eventName').value.trim(); 
                const a = document.createElement('a'); 
                a.href = comboCanvas.toDataURL('image/jpeg', 0.9); 
                a.download = (d&&n) ? `${d}_${n}_combined.jpg` : `stage_plan_combined.jpg`; 
                document.body.appendChild(a); a.click(); document.body.removeChild(a); 
            }); 
        }

                var origRenderOnAddRemove = cvs.renderOnAddRemove;
                cvs.renderOnAddRemove = false;
                
                objects.forEach(function(o) {
                    cvs.add(o);
                });

                cvs.renderOnAddRemove = origRenderOnAddRemove;
                cvs.requestRenderAll();

        window.addEventListener('keydown', e => {
            if(document.activeElement.tagName==='INPUT') return;
            const cvs = getActiveCanvas(); if(!cvs) return;
            if (e.ctrlKey || e.metaKey) { 
                switch(e.key) { 
                    case 'z': e.preventDefault(); undo(); break; 
                    case 'y': e.preventDefault(); redo(); break; 
                    case 'c': e.preventDefault(); copyObject(); break; 
                    case 'v': e.preventDefault(); pasteObject(); break; 
                    case 'g': 
                    case 'G': 
                        e.preventDefault(); 
                        if(e.shiftKey) ungroupObjects(); else groupObjects(); 
                        break; 
                } 
                return; 
            }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const a = cvs.getActiveObject();
                if (a && !a.isEditing) {
                    if (a.type === 'activeSelection') {
                        const objects = a.getObjects(); cvs.discardActiveObject(); let removed = false;
                        objects.forEach(o => { if (!o.isPermanent) { cvs.remove(o); removed = true; } });
                        if(removed) saveHistory(activeCanvasId); cvs.requestRenderAll();
                    } else {
                        if (!a.isPermanent) { cvs.discardActiveObject(); cvs.remove(a); saveHistory(activeCanvasId); }
                    }
                }
            }
            const a = cvs.getActiveObject();
            if (a && !a.isEditing) {
                const s = e.shiftKey ? 10 : 1;
                switch(e.key) { case 'ArrowLeft': a.set('left', a.left - s); e.preventDefault(); break; case 'ArrowRight': a.set('left', a.left + s); e.preventDefault(); break; case 'ArrowUp': a.set('top', a.top - s); e.preventDefault(); break; case 'ArrowDown': a.set('top', a.top + s); e.preventDefault(); break; }
                a.setCoords(); cvs.renderAll();
            }
        });
